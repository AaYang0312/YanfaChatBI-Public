  <text x="66" y="330" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#4B4B4B">PostgreSQL · MySQL · MongoDB · ClickHouse · 表格与视图</text>

  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif">
    <rect x="790" y="58" width="348" height="86" fill="#111111"/>
    <rect x="780" y="48" width="348" height="86" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
